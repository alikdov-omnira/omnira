services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: odls, POSTGRES_USER: odls, POSTGRES_PASSWORD: odls }
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  core-service:
    build: { context: ., dockerfile: Dockerfile.core }
    env_file: .env
    environment: { CORE_SERVICE_PORT: "3001", DATABASE_URL: "postgresql://odls:odls@postgres:5432/odls", DOCUMENT_STORAGE_ROOT: "/var/lib/odls/documents", DOCUMENT_MAX_BYTES: "10485760" }
    ports: ["3001:3001"]
    depends_on: [postgres]
    volumes: ["document_data:/var/lib/odls/documents"]
  api-gateway:
    build: { context: ., dockerfile: Dockerfile.gateway }
    env_file: .env
    environment: { GATEWAY_PORT: "3000", CORE_SERVICE_URL: "http://core-service:3001", WEB_ORIGIN: "http://127.0.0.1:5173" }
    ports: ["3000:3000"]
    depends_on: [core-service]
  notification-worker:
    build: { context: ., dockerfile: Dockerfile.worker }
    env_file: .env
    environment: { DATABASE_URL: "postgresql://odls:odls@postgres:5432/odls", NOTIFICATION_WORKER_HEALTH_PORT: "3002", NOTIFICATION_WORKER_POLL_MS: "2000", NOTIFICATION_WORKER_BATCH_SIZE: "25", NOTIFICATION_WORKER_MAX_ATTEMPTS: "5", NOTIFICATION_DUE_SOON_DAYS: "3" }
    ports: ["3002:3002"]
    depends_on: [postgres]
volumes:
  postgres_data:
  document_data:
